spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leavedb?serverTimezone=Asia/Taipei&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

##本機除錯設定
logging.level.com.alin.lin=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
##要查 405 或路由問題時，可暫時加：
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

##app.auth.session-mode=jwt
app.auth.session-mode=redis
app.jwt.secret=${JWT_SECRET}
app.jwt.expire-minutes=30

# Redis 連線
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Session 30 分鐘沒動作就過期（跟之前 JWT 一樣長，方便比較）
spring.session.timeout=30m

# Session Cookie 屬性
# server.servlet.session.cookie.http-only=true
# server.servlet.session.cookie.same-site=lax


